# Smithery configuration for ANTT: Produtos Perigosos
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_antt_produtos_perigosos

name: antt_produtos_perigosos-mcp
displayName: "ANTT: Produtos Perigosos"
description: >
  ANTT: Produtos Perigosos, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/antt_produtos_perigosos-mcp
repository: https://github.com/mcp-dir/antt_produtos_perigosos-mcp

tags:
  - antt_produtos_perigosos
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_antt_produtos_perigosos

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_antt_produtos_perigosos/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
